# Referencia del CI de la web. En el Sprint 5 se copia a .github/workflows/ci.yml.
# Acciones fijadas por SHA (verificadas el 09/10/2026 con git ls-remote): actions/checkout v7.0.1 · pnpm/setup v3.0.0.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - name: Sin datos reales en el repo público
        run: pnpm run revisar:datos
      - name: Protecciones de Claude Code
        run: node .claude/hooks/probar-hooks.mjs
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm audit --prod --audit-level high
